
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Baby Angel 💗</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <!-- Chiikawa Usagi background images -->
        <img src="c:\xampp\htdocs\Tisoy\bilat.jpg" class="usagi usagi1" alt="">
        <img src="c:\xampp\htdocs\Tisoy\usagi.jpg.jfif" class="usagi usagi2" alt="">
        <img src="c:\xampp\htdocs\Tisoy\burat.jpg" class="usagi usagi3" alt="">
      

        <!-- Hearts in the corners -->
        <div class="corner-heart top-left">♥</div>
        <div class="corner-heart top-right">♥</div>
        <div class="corner-heart bottom-left">♥</div>
        <div class="corner-heart bottom-right">♥</div>

        <!-- Floating hearts -->
        <div id="hearts"></div>

        <!-- First screen -->
        <section class="welcome" id="welcome">
            <h1>For My Baby Angel ♡</h1>
            <p>I have something special for you...</p>

            <button id="clickMe">CLICK ME ♡</button>

            <p class="hint">A little surprise made with love 💗</p>
        </section>

        <!-- Love letter screen -->
        <section class="letter-screen" id="letterScreen">
            <div class="letter-card">

                <div class="envelope" id="envelope">
                    <div class="envelope-back"></div>
                    <div class="letter-paper"></div>
                    <div class="envelope-flap"></div>
                    <div class="envelope-heart">♥</div>
                </div>

                <p class="letter-label">A little letter for you</p>

                <h2 id="loveMessage"></h2>

                <p id="signature" class="signature">
                    Forever and always, my love ♡
                </p>

                <button id="replay">Read Again ↻</button>

            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
